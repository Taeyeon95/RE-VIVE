<style>
        body { font-family: 'Hanken Grotesk', sans-serif; background-color: #fafaf4; overflow-x: hidden; }
        
        /* Dynamic Shake Animation */
        .shake-anim {
            animation: shake-complex 0.6s cubic-bezier(.36,.07,.19,.97) both infinite;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }
        @keyframes shake-complex {
            0%, 100% { transform: translateX(0) rotate(0); }
            15% { transform: translateX(-8px) rotate(-10deg); }
            30% { transform: translateX(6px) rotate(8deg); }
            45% { transform: translateX(-6px) rotate(-6deg); }
            60% { transform: translateX(4px) rotate(4deg); }
            75% { transform: translateX(-2px) rotate(-2deg); }
        }

        /* Ripple Effect */
        .ripple-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(144, 77, 0, 0.1);
            animation: ripple 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }
        .ripple-bg:nth-child(2) { animation-delay: 0.6s; }
        .ripple-bg:nth-child(3) { animation-delay: 1.2s; }
        
        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* Progress Ring Animation */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Pulse for Button */
        .pulse-btn:active, .pulse-btn:hover {

        @keyframes pulse-small {

            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(21, 66, 18, 0); }

<script>
        // Simulate Shaking Logic for UI demo
        let count = 0;
        const target = 50;
        const counterEl = document.getElementById('counter');
        const progressCircle = document.getElementById('progress-circle');
        const phoneIcon = document.getElementById('phone-icon');
        const finishBtn = document.getElementById('finish-btn');
        const radius = 110;
        const circumference = 2 * Math.PI * radius;

        function updateProgress(value) {
            const offset = circumference - (value / target) * circumference;
            progressCircle.style.strokeDashoffset = offset;
            counterEl.innerText = Math.floor(value);
            
            // Add a slight bounce scale effect to counter on update
            counterEl.style.transform = 'scale(1.2)';
            setTimeout(() => { counterEl.style.transform = 'scale(1)'; }, 100);
            
            if (value >= target) {
                phoneIcon.classList.remove('shake-anim');
                phoneIcon.classList.add('bg-secondary');
                phoneIcon.classList.add('text-on-secondary');
                phoneIcon.querySelector('span').innerText = 'celebration';
                
                // Stop ripples when done
                document.querySelectorAll('.ripple-bg').forEach(el => el.style.display = 'none');
            }
        }

        // Auto-simulation for presentation purposes
        let simulateInterval = setInterval(() => {
            if (count < target) {
                // Incrementally update to show smooth bar fill
                count += 0.5; 
                updateProgress(count);
            } else {
                clearInterval(simulateInterval);
            }
        }, 80);

        // Micro-interaction on finish button
        finishBtn.addEventListener('click', () => {
            if (count < target) {
                // Just for the demo, jump to finish
                count = target;
                updateProgress(target);
            } else {
                alert('충동을 이겨내셨습니다! 도파민 점수가 +10 상승했습니다.');
            }
        });
    </script>
